{% extends 'layout.html' %}

{% block titulo %}Iniciar Sesión{% endblock %}

{% block contenido %}
<div class="login-page">
    <div class="card login-card">
        <!-- Línea de acento superior -->
        <div style="position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--lime),var(--brand));border-radius:var(--radius-lg) var(--radius-lg) 0 0;"></div>
        
        <div class="login-brand">
            <div class="mark">
                <svg viewBox="0 0 24 24" style="width:26px;height:26px;stroke:#0B1406;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;"><use href="#ic-qr"/></svg>
            </div>
            <h1>Asistencia QR · SENA</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        {% if error %}
        <div class="flash-error">
            <svg class="icon" style="width:14px;height:14px;display:inline;vertical-align:middle;margin-right:6px;stroke:var(--red-ink)"><use href="#ic-alert"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-field">
                <label for="documento">Número de documento</label>
                <input type="text" id="documento" name="documento" placeholder="Ej. 1075342198" required autofocus>
            </div>
            
            <div class="form-field" style="margin-bottom:24px;">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:14.5px;">
                Iniciar sesión
            </button>
        </form>

        <p style="text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px;">
            SENA · Regional Huila · Sistema de Control de Asistencia
        </p>
    </div>
</div>
{% endblock %}
